services:
  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    container_name: video_mediamtx
    ports:
      - "8554:8554"
      - "8888:8888"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8888 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  ffmpeg:
    image: jrottenberg/ffmpeg:4.4-alpine
    container_name: video_ffmpeg
    deploy:
      resources:
        limits:
          memory: 1000M
        reservations:
          memory: 300M
    depends_on:
      mediamtx:
        condition: service_healthy
    command: >-
      -rtsp_transport tcp
      -i  "rtsp://${RTSP_USERNAME}:${RTSP_PASSWORD}@${RTSP_HOST}${RTSP_PATH}"
      -c:v libx264
      -preset ultrafast
      -tune zerolatency
      -profile:v baseline
      -level 3.1
      -pix_fmt yuv420p
      -r 25
      -g 50
      -b:v 800k
      -maxrate 1000k
      -bufsize 1500k
      -an
      -vf scale=640:-1
      -f rtsp
      -rtsp_transport tcp
      rtsp://mediamtx:8554/cam
    restart: unless-stopped

  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: video_webapp
    ports:
      - "5173:5173"
    volumes:
      - .:/app:cached
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
    depends_on:
      - mediamtx
    restart: unless-stopped

volumes:
  node_modules:
