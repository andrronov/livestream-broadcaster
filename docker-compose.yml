version: "3.8"

services:
  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    container_name: video_mediamtx
    ports:
      - "8554:8554"
      - "8888:8888"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8888 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - video_network

  ffmpeg:
    image: jrottenberg/ffmpeg:4.4-alpine
    container_name: video_ffmpeg
    depends_on:
      mediamtx:
        condition: service_healthy
    command:
      [
        "-rtsp_transport",
        "tcp",
        "-i",
        "rtsp://filder:m%40kr0mE2@176.196.225.210:9554/cam/realmonitor?channel=1&subtype=0",
        "-c:v",
        "libx264",
        "-preset",
        "ultrafast",
        "-tune",
        "zerolatency",
        "-profile:v",
        "baseline",
        "-level",
        "3.1",
        "-pix_fmt",
        "yuv420p",
        "-r",
        "25",
        "-g",
        "50",
        "-b:v",
        "1500k",
        "-maxrate",
        "2000k",
        "-bufsize",
        "3000k",
        "-an",
        "-vf",
        "scale=640:-1",
        "-f",
        "rtsp",
        "-rtsp_transport",
        "tcp",
        "rtsp://mediamtx:8554/cam",
      ]
    restart: unless-stopped
    networks:
      - video_network

  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: video_webapp
    ports:
      - "5173:5173"
    volumes:
      - .:/app:cached
      - /app/node_modules
    environment:
      - NODE_ENV=development
    depends_on:
      - mediamtx
    restart: unless-stopped
    networks:
      - video_network

networks:
  video_network:
    driver: bridge

volumes:
  node_modules:
